# ONPAR CI — 저장소 하나에 Node(서버·학습지 엔진) · Flutter(앱) · Postgres(DB) 가 같이 있다.
# 셋을 한 워크플로에서 병렬로 돌리되, 무엇이 깨졌는지가 job/step 이름만 보고 드러나게 나눈다.
name: CI

on:
  push:
  pull_request:

# 같은 브랜치에 연달아 밀면 앞의 실행은 취소한다. PR 브랜치는 push 와 pull_request 가
# 둘 다 걸리는데, 그 둘은 ref 가 달라 서로를 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.35.5'

jobs:
  # ── 1. 서버 · 학습지 엔진 · DB ────────────────────────────────────────────
  # server/tests/run.sh 를 그대로 부른다. 로컬에서 치는 명령과 CI 가 치는 명령이
  # 같아야 "CI 에서만 깨진다" 가 없다.
  server:
    name: server (node + postgres + chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # 마이그레이션은 gen_random_uuid()(pgcrypto/pg13+)와 create role 을 쓴다.
        # postgres 계정이 슈퍼유저라야 00_shim.sql 이 역할을 만들 수 있다.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # server/supabase/tests/run.sh 는 psql/createdb/dropdb 를 접속 옵션 없이 부른다.
      # 그래서 접속 정보는 전부 libpq 환경변수로 넘긴다.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: postgresql-client 설치
        # 러너에 psql 이 있어도 서버(16)보다 낮은 버전일 수 있다. 버전을 맞춰 둔다.
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          psql --version

      - name: Playwright(Chromium) 설치
        # 이 저장소는 node_modules 를 두지 않는다. 테스트가 `npm root -g` 에서 찾으므로
        # 반드시 전역으로 깔아야 하고, 브라우저 바이너리도 따로 받아야 한다.
        run: |
          npm install -g playwright@1
          npx --yes playwright@1 install --with-deps chromium

      - name: DB 접속 확인
        run: psql -X -c 'select version();'

      - name: server/tests/run.sh
        run: bash server/tests/run.sh

      - name: 실패했을 때 볼 것
        if: failure()
        run: |
          echo "::error::서버 테스트가 실패했습니다. 위 로그에서 ▸ 로 시작하는 마지막 구간이 깨진 곳입니다."
          echo "재현: PGHOST=localhost PGUSER=postgres PGPASSWORD=postgres bash server/tests/run.sh"

  # ── 2. Flutter 앱 ────────────────────────────────────────────────────────
  app:
    name: app (flutter analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          # 버전을 고정한다. 채널만 지정하면 Flutter 가 올라갈 때 우리 잘못 없이 CI 가 깨진다.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      # 앱이 path 의존성으로 참조한다. 여기서 먼저 받아 두지 않으면 앱 pub get 이 실패한다.
      - name: pub get (packages/design_system)
        run: flutter pub get
        working-directory: packages/design_system

      - name: pub get (app)
        run: flutter pub get
        working-directory: app

      - name: analyze (design_system)
        run: flutter analyze --fatal-infos --fatal-warnings
        working-directory: packages/design_system

      # 경고 0 이 이 저장소의 기준이다. info 도 실패로 친다 — 한 번 쌓이기 시작하면
      # 아무도 안 읽는 목록이 된다.
      - name: analyze (app)
        run: flutter analyze --fatal-infos --fatal-warnings
        working-directory: app

      - name: test (app)
        run: flutter test --reporter expanded
        working-directory: app

  # ── 3. 생성물 드리프트 ────────────────────────────────────────────────────
  # 토큰·아이콘·런타임·에셋은 전부 생성물이다. 손으로 고친 생성물이 커밋되면
  # 다음 빌드가 조용히 되돌린다. 그래서 "지금 다시 만들면 같은가" 를 검사한다.
  # 각 검사를 별도 step 으로 둔 이유는 하나뿐이다 — 무엇이 낡았는지 step 이름으로 보이게.
  drift:
    name: drift (generated files)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: design/build_tokens.mjs --check
        run: node design/build_tokens.mjs --check

      - name: design/build_icons.mjs --check
        run: node design/build_icons.mjs --check

      - name: design/build_brand.mjs --check
        run: node design/build_brand.mjs --check

      - name: server/build-runtime.mjs --check
        run: node server/build-runtime.mjs --check

      - name: server/build-assets.mjs --check
        run: node server/build-assets.mjs --check
