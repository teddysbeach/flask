name: onpar
description: ONPAR — 배우고 싶은 개념을 넣으면 6단계 학습지를 만들어 주고, 애플펜슬로 풀고, 망각곡선으로 복습시킨다.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  onpar_design_system:
    path: ../packages/design_system

  # 라우팅 — 딥링크와 인증 가드가 한곳에 모여야 "로그인 후 원래 화면 복귀"가 샌 곳 없이 된다
  go_router: ^14.6.2
  # 상태 — 화면마다 Loading/Empty/Error 를 같은 모양으로 다루려고 AsyncValue 를 쓴다
  flutter_riverpod: ^2.6.1

  supabase_flutter: ^2.8.0
  # 학습지 뷰어. 필기 런타임이 flutter_inappwebview 브리지를 이미 쓰고 있어 이건 고정이다
  flutter_inappwebview: ^6.1.5

  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

  in_app_purchase: ^3.2.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.2
  permission_handler: ^11.3.1
  app_links: ^6.3.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  sign_in_with_apple: ^6.1.3
  google_sign_in: ^6.2.2
  intl: ^0.20.1
  # Apple 로그인 nonce 해시. 직접 구현하지 않는다.
  crypto: ^3.0.6

  # 오프라인 보관함. 학습지 본문과 아직 못 올린 필기를 기기에 둔다.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # pubspec 자체를 테스트가 읽는다(글꼴 선언이 실제 파일과 맞는지).
  yaml: ^3.1.2

flutter:
  uses-material-design: true

  # 로고·심볼은 디자인 시스템이 도형(SvgPicture.string)으로 들고 있고,
  # 런처 아이콘과 스플래시는 네이티브 리소스에 있다
  # (ios/Runner/Assets.xcassets, android/app/src/main/res).
  # 원본과 생성기는 design/brand/ 와 design/build_brand.mjs 다.
  assets:
    # 학습지 WebView 가 onpar-asset:// 로 같은 파일을 가져다 쓴다.
    # 앱과 학습지가 한 파일을 보게 해야 두 화면의 글자 모양이 갈라지지 않는다.
    - assets/fonts/PretendardVariable.subset.ttf
    # OFL 1.1 은 서브셋(파생물)에도 라이선스 전문 동봉을 요구한다. 라이선스 화면이 읽는다.
    - assets/fonts/Pretendard-OFL.txt

  fonts:
    # design_tokens.json 이 이름으로 부르는 그 글꼴. 생성기는 design/build_font.mjs.
    # 가변 축(wght 45~930)이라 파일 하나로 400·500·600·700 을 다 쓴다.
    - family: Pretendard Variable
      fonts:
        - asset: assets/fonts/PretendardVariable.subset.ttf
